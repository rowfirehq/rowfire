[alembic]
# %(here)s is the directory holding this file, so `alembic -c <path>` works
# from any working directory. The container runs it from /work, where the
# definitions being imported are mounted, while the config lives in /app.
script_location = %(here)s/migrations
prepend_sys_path = src
# The URL is not set here on purpose -- env.py reads ROWFIRE_PLATFORM_DSN, so
# a control-plane credential never lands in a checked-in config file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
