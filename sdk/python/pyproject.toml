[project]
name = "rowfire-sdk"
version = "0.1.0.dev0"
description = "Prototype: send business events from inside an app to Rowfire, without giving it database access"
license = "AGPL-3.0"
# Lower than Rowfire's own floor: this runs inside the customer's app.
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rowfire_sdk"]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py39"
src = ["src", "tests", "bench"]
